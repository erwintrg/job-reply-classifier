[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-reply-classifier"
version = "0.1.0"
description = "Watches Gmail inboxes for replies to job applications, classifies them with Claude Haiku and routes them."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Erwin Truong" }]
requires-python = ">=3.10"
# The core, the demo and the Gmail source use only the standard library.
dependencies = ["tzdata; platform_system == 'Windows'"]

[project.optional-dependencies]
anthropic = ["anthropic>=1,<2"]
dev = ["pytest>=8"]

[project.scripts]
job-reply-watch = "job_reply_classifier.cli:main"

[tool.setuptools.packages.find]
include = ["job_reply_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
